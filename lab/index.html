<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Trip Butler — AI 여행 플래너 (프로토타입)</title>
  <meta name="description" content="전세계 어느 도시든 AI가 가족 맞춤 여행 일정을 설계합니다." />
  <meta name="theme-color" content="#1E3A5F" />

  <!-- 폰트 -->
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- Tailwind CDN (preflight off — styles.css와 충돌 방지) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { corePlugins: { preflight: false } };</script>

  <!-- 런던앱 디자인 시스템 재사용 -->
  <link rel="stylesheet" href="/css/styles.css" />

  <style>
    /* 프로토타입 전용 보강 스타일 */
    .tb-hero { background: var(--butler-bg); color:#fff; padding:22px 18px; border-radius:0 0 22px 22px; }
    .tb-hero h1 { font-size:20px; font-weight:800; margin:0; }
    .tb-hero p { font-size:12px; opacity:.85; margin:4px 0 0; }
    .tb-wrap { max-width:560px; margin:0 auto; padding:16px 16px 60px; }
    .tb-label { font-size:12px; font-weight:700; color:var(--text-secondary); margin:14px 0 6px; }
    .tb-input { width:100%; padding:12px 14px; border:1.5px solid var(--border); border-radius:12px;
      font-size:16px; background:var(--bg-card); color:var(--text-primary); box-sizing:border-box; }
    .tb-chips { display:flex; flex-wrap:wrap; gap:8px; }
    .tb-chip { padding:7px 12px; border-radius:20px; font-size:13px; cursor:pointer;
      border:1.5px solid var(--border); background:var(--bg-card); color:var(--text-secondary); }
    .tb-chip.on { background:var(--primary); color:#fff; border-color:var(--primary); font-weight:700; }
    .tb-chip.ghost { background:var(--bg-section); }
    .tb-stepper { display:flex; align-items:center; gap:14px; }
    .tb-stepper button { width:40px; height:40px; border-radius:50%; border:1.5px solid var(--border);
      background:var(--bg-card); font-size:20px; font-weight:700; color:var(--primary); cursor:pointer; }
    .tb-stepper .val { font-size:22px; font-weight:800; min-width:54px; text-align:center; }
    .tb-go { width:100%; margin-top:22px; padding:15px; border:none; border-radius:14px;
      background:var(--primary); color:#fff; font-size:16px; font-weight:800; cursor:pointer; }
    .tb-go:disabled { opacity:.6; }
    .tb-widget-row { display:flex; gap:10px; margin:12px 0; }
    .tb-widget { flex:1; background:var(--bg-card); border:1px solid var(--border); border-radius:14px;
      padding:12px 14px; box-shadow:0 2px 8px var(--shadow); }
    .tb-day-head { display:flex; align-items:center; gap:8px; margin:18px 0 8px; }
    .tb-day-num { background:var(--secondary); color:#fff; font-weight:800; font-size:13px;
      padding:4px 10px; border-radius:8px; }
    .tb-poi { display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); }
    .tb-poi:last-child { border-bottom:none; }
    .tb-poi .emo { font-size:26px; }
    .tb-spinner { width:40px; height:40px; border:4px solid var(--border); border-top-color:var(--primary);
      border-radius:50%; animation:tbspin 0.9s linear infinite; margin:40px auto 16px; }
    @keyframes tbspin { to { transform:rotate(360deg); } }
    .tb-badge { display:inline-block; font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px;
      background:var(--warm-light); color:var(--warm); }
  </style>
</head>

<body x-data="butlerTrip()" x-init="init()" x-cloak style="background:var(--bg); min-height:100vh;">

  <header class="tb-hero">
    <h1>🎩 Trip Butler</h1>
    <p>전세계 어느 도시든 — AI가 맞춤 여행 일정을 설계합니다 <span class="tb-badge" style="background:rgba(255,255,255,.2);color:#fff;">prototype</span></p>
  </header>

  <main class="tb-wrap">

    <!-- ============ 설정 화면 ============ -->
    <section x-show="step === 'setup'">
      <div class="tb-label">📍 어디로 떠나세요?</div>
      <input class="tb-input" type="text" x-model="form.city" placeholder="도시 이름 (예: 도쿄, 파리, 뉴욕...)"
             @keydown.enter="generate()" />
      <div class="tb-chips" style="margin-top:8px;">
        <template x-for="c in exampleCities" :key="c">
          <span class="tb-chip ghost" @click="setCity(c)" x-text="c"></span>
        </template>
      </div>

      <div class="tb-label">🗓️ 시작일 & 일수</div>
      <div style="display:flex; gap:12px; align-items:center;">
        <input class="tb-input" type="date" x-model="form.startDate" style="flex:1;" />
        <div class="tb-stepper">
          <button @click="form.days = Math.max(1, form.days - 1)">−</button>
          <span class="val" x-text="form.days + '일'"></span>
          <button @click="form.days = Math.min(10, form.days + 1)">＋</button>
        </div>
      </div>

      <div class="tb-label">👥 누구와 함께?</div>
      <div class="tb-chips">
        <template x-for="p in partyOptions" :key="p.id">
          <span class="tb-chip" :class="form.party === p.id ? 'on' : ''" @click="form.party = p.id" x-text="p.label"></span>
        </template>
      </div>

      <div class="tb-label">✨ 관심사 (복수 선택)</div>
      <div class="tb-chips">
        <template x-for="i in interestOptions" :key="i">
          <span class="tb-chip" :class="isInterest(i) ? 'on' : ''" @click="toggleInterest(i)" x-text="i"></span>
        </template>
      </div>

      <template x-if="error">
        <div style="margin-top:14px; color:var(--error); font-size:13px; text-align:center;" x-text="error"></div>
      </template>

      <button class="tb-go" @click="generate()" x-text="'🎩 ' + (form.city.trim() || '여행') + ' 일정 만들기'"></button>
    </section>

    <!-- ============ 로딩 ============ -->
    <section x-show="step === 'loading'" style="text-align:center; padding-top:30px;">
      <div class="tb-spinner"></div>
      <div style="font-size:15px; font-weight:600; color:var(--text-secondary);" x-text="loadingMsg"></div>
      <div style="font-size:12px; color:var(--text-light); margin-top:6px;">실제 장소·좌표를 바탕으로 설계 중이에요 (약 5~10초)</div>
    </section>

    <!-- ============ 결과 화면 ============ -->
    <section x-show="step === 'result' && plan">
      <!-- 목적지 헤더 -->
      <div class="card" style="padding:16px; margin-bottom:6px;">
        <div style="display:flex; align-items:baseline; gap:8px;">
          <span style="font-size:22px; font-weight:900;" x-text="plan && plan.destination.cityKo"></span>
          <span style="font-size:13px; color:var(--text-light);" x-text="plan && (plan.destination.city + ' · ' + plan.destination.countryKo)"></span>
        </div>
        <div style="font-size:13px; color:var(--text-secondary); margin-top:6px;" x-text="plan && plan.destination.summary"></div>
        <div class="tb-chips" style="margin-top:10px;">
          <template x-for="h in (plan ? plan.destination.highlights : [])" :key="h">
            <span class="tb-chip ghost" style="cursor:default;" x-text="'#' + h"></span>
          </template>
        </div>
      </div>

      <!-- 적응형 날씨 + 환율 -->
      <div class="tb-widget-row">
        <div class="tb-widget">
          <div style="font-size:11px; color:var(--text-light); font-weight:700;">🌤️ 현재 날씨</div>
          <template x-if="weather.loaded">
            <div style="margin-top:4px;">
              <span style="font-size:20px;" x-text="weather.icon"></span>
              <span style="font-size:18px; font-weight:800;" x-text="weather.tempC + '°C'"></span>
              <div style="font-size:12px; color:var(--text-secondary);" x-text="weather.desc + ' · 💧' + weather.humidity + '%'"></div>
            </div>
          </template>
          <template x-if="!weather.loaded && !weather.failed"><div style="font-size:12px; color:var(--text-light); margin-top:4px;">불러오는 중…</div></template>
          <template x-if="weather.failed"><div style="font-size:12px; color:var(--text-light); margin-top:4px;">날씨 정보 없음</div></template>
        </div>
        <div class="tb-widget">
          <div style="font-size:11px; color:var(--text-light); font-weight:700;">💱 환율 (→ KRW)</div>
          <template x-if="currency.loaded && currency.code !== 'KRW'">
            <div style="margin-top:4px;">
              <span style="font-size:18px; font-weight:800; color:var(--primary);" x-text="currency.symbol + '1 = ₩' + Math.round(currency.rate).toLocaleString()"></span>
              <div style="font-size:11px; color:var(--text-light);" x-text="currency.code + (currency.date ? ' · ' + currency.date : '')"></div>
            </div>
          </template>
          <template x-if="currency.loaded && currency.code === 'KRW'"><div style="font-size:13px; color:var(--text-secondary); margin-top:4px;">원화 사용 지역</div></template>
          <template x-if="!currency.loaded && !currency.failed"><div style="font-size:12px; color:var(--text-light); margin-top:4px;">불러오는 중…</div></template>
          <template x-if="currency.failed"><div style="font-size:12px; color:var(--text-light); margin-top:4px;">환율 정보 없음</div></template>
        </div>
      </div>

      <!-- Day별 일정 -->
      <template x-for="d in (plan ? plan.days : [])" :key="d.day">
        <div>
          <div class="tb-day-head">
            <span class="tb-day-num" x-text="'Day ' + d.day"></span>
            <span style="font-size:12px; color:var(--text-light);" x-text="dateForDay(d.day)"></span>
            <span style="font-size:14px; font-weight:700;" x-text="d.concept"></span>
          </div>
          <div class="card" style="padding:4px 16px;">
            <template x-for="(a, i) in d.activities" :key="i">
              <div class="tb-poi">
                <span class="emo" x-text="a.emoji || typeEmoji(a.type)"></span>
                <div style="flex:1; min-width:0;">
                  <div style="font-size:14px; font-weight:700;">
                    <span x-text="a.nameKo || a.name"></span>
                    <span class="tb-badge" style="margin-left:6px;" x-text="typeLabel(a.type)"></span>
                  </div>
                  <div style="font-size:12px; color:var(--text-light); margin:2px 0;" x-text="a.name + (a.duration ? ' · ⏱️ ' + a.duration : '')"></div>
                  <div style="font-size:13px; color:var(--text-secondary); line-height:1.5;" x-text="'💡 ' + a.why"></div>
                  <template x-if="a.tip">
                    <div style="font-size:12px; color:var(--text-secondary); margin-top:2px;" x-text="'📌 ' + a.tip"></div>
                  </template>
                  <a :href="mapLink(a)" target="_blank" rel="noopener"
                     style="display:inline-block; margin-top:6px; font-size:12px; color:var(--info); text-decoration:underline;">🗺️ 지도에서 보기</a>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- 여행 팁 -->
      <template x-if="plan && plan.tips && plan.tips.length">
        <div class="card" style="padding:14px 16px; margin-top:16px; border-left:3px solid var(--accent);">
          <div style="font-size:13px; font-weight:700; margin-bottom:8px;">🎩 버틀러의 팁</div>
          <template x-for="(t, i) in plan.tips" :key="i">
            <div style="font-size:13px; color:var(--text-secondary); line-height:1.7;" x-text="'• ' + t"></div>
          </template>
        </div>
      </template>

      <button class="tb-go" style="background:var(--secondary);" @click="reset()">🔄 다른 여행 계획하기</button>
      <p style="text-align:center; font-size:11px; color:var(--text-light); margin-top:14px;">
        ⚠️ AI 생성 결과입니다. 영업시간·요금·위치는 방문 전 한 번 더 확인하세요.
      </p>
    </section>

  </main>

  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <script src="/lab/app.js"></script>
</body>
</html>
