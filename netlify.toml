[build]
  publish = "."

# Firebase 웹 config의 apiKey는 공개 클라이언트 값(보안은 Firestore 규칙).
# Netlify Secret Controller가 Google API key 패턴으로 오인해 차단하는 것을 화이트리스트.
# 두 firebase-config 파일(런던앱·Travel Butler)만 스캔 제외 — 다른 파일은 정상 스캔.
[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "js/firebase-config.js,lab/firebase-config.js"

# Phase 2+에서 Netlify Functions(Claude Butler, 날씨 등)를 추가할 때 사용
[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
